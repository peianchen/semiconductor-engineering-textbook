<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc" data-figure-style="sts-flat-v1">
<title id="title">斜率看變化速度，面積看累積電荷</title><desc id="desc">固定10奈法電容在20微秒由0.2伏線性升至1.2伏。斜率0.05伏每微秒對應0.5毫安固定電流；電流時間面積為10奈庫侖，對應1伏增加量。此圖是自設固定電流情境，不是電阻充電曲線。</desc>
