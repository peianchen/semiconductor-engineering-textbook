<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc" data-figure-style="sts-flat-v1">
<title id="title">離散量測：積分近似與差分雜訊</title><desc id="desc">左圖電流於0,1,2,3毫秒取樣為0,2,2,0毫安，依分段直線插值的梯形面積為4微庫侖。右圖假設相鄰電壓雜訊獨立且標準差均為1毫伏，兩點差分的斜率雜訊標準差隨時間間隔縮短十倍而增加十倍。所有數值為自設，不是實測。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2e3d59" stroke-width="1.3"/></marker></defs>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC","DejaVu Sans",sans-serif;fill:#2e3d59}.panel{font-size:25px;font-weight:600}.label{font-size:22px}.note{font-size:20px;fill:#536781}.badge{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#ffffff}</style>
<rect width="1200" height="610" fill="#ffffff"/><circle cx="55" cy="35" r="19" fill="#7185a6"/><text x="55" y="42" class="badge" text-anchor="middle">1</text><text x="88" y="43" class="panel" text-anchor="start">離散量測：積分近似與差分雜訊</text><line x1="38" y1="66" x2="1162" y2="66" stroke="#c5cfdd" stroke-width="2"/>
<text x="85" y="115" class="note" text-anchor="start">自設四個樣本，以直線連接估算</text><line x1="110" y1="390" x2="110" y2="180" stroke="#c5cfdd" stroke-width="2"/><text x="110" y="422" class="note" text-anchor="middle">0</text><line x1="256.66666666666663" y1="390" x2="256.66666666666663" y2="180" stroke="#c5cfdd" stroke-width="2"/><text x="256.66666666666663" y="422" class="note" text-anchor="middle">1</text><line x1="403.3333333333333" y1="390" x2="403.3333333333333" y2="180" stroke="#c5cfdd" stroke-width="2"/><text x="403.3333333333333" y="422" class="note" text-anchor="middle">2</text><line x1="550" y1="390" x2="550" y2="180" stroke="#c5cfdd" stroke-width="2"/><text x="550" y="422" class="note" text-anchor="middle">3</text><line x1="110" y1="390" x2="550" y2="390" stroke="#c5cfdd" stroke-width="2"/><text x="96" y="397" class="note" text-anchor="end">0</text><line x1="110" y1="306" x2="550" y2="306" stroke="#c5cfdd" stroke-width="2"/><text x="96" y="313" class="note" text-anchor="end">1</text><line x1="110" y1="222" x2="550" y2="222" stroke="#c5cfdd" stroke-width="2"/><text x="96" y="229" class="note" text-anchor="end">2</text><line x1="110" y1="390" x2="560" y2="390" stroke="#2e3d59" stroke-width="2"/><line x1="110" y1="390" x2="110" y2="170" stroke="#2e3d59" stroke-width="2"/><text x="330" y="462" class="label" text-anchor="middle">時間 t (ms)</text><text x="110" y="150" class="label" text-anchor="start">i (mA)</text><path d="M110 390 L256.66666666666663 222 L403.3333333333333 222 L550 390 Z" fill="#faead7" stroke="#b56b28" stroke-width="2" /><path d="M110 390 L256.66666666666663 222 L403.3333333333333 222 L550 390" fill="none" stroke="#4c6d96" stroke-width="3" /><circle cx="110" cy="390" r="6" fill="#4c6d96"/><circle cx="256.66666666666663" cy="222" r="6" fill="#4c6d96"/><circle cx="403.3333333333333" cy="222" r="6" fill="#4c6d96"/><circle cx="550" cy="390" r="6" fill="#4c6d96"/><text x="327" y="340" class="note" text-anchor="middle">梯形面積合計 4 µC</text><text x="685" y="115" class="note" text-anchor="start">差分：同樣雜訊，較短間隔更敏感</text><text x="705" y="194" class="note" text-anchor="start">相鄰電壓樣本：獨立、同標準差</text><text x="705" y="236" class="label" text-anchor="start">σv = 1 mV</text><text x="705" y="290" class="label" text-anchor="start">σ斜率 = √2 σv / Δt</text><rect x="705" y="322" width="400" height="61" fill="#e4eaf2" stroke="#c5cfdd" stroke-width="2"/><text x="725" y="361" class="label" text-anchor="start">Δt = 100 µs → 14.14 V/s</text><rect x="705" y="399" width="400" height="61" fill="#faead7" stroke="#c5cfdd" stroke-width="2"/><text x="725" y="438" class="label" text-anchor="start">Δt = 10 µs → 141.42 V/s</text><text x="600" y="539" class="note" text-anchor="middle">左：只對分段線性插值精確；右：雜訊標準差的理論例，不是實測。</text><text x="600" y="576" class="note" text-anchor="middle">時間積分不會自動消除固定偏移，取樣更密也不保證導數估得更準。</text>
</svg>
