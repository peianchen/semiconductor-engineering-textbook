<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
<title id="title">從需求到出貨：晶片生命旅程</title><desc id="desc">需求、設計、光罩、投片、晶圓製造、晶圓測試、封裝與最終測試。虛線表示主要資訊交付，實線表示晶圓與晶粒實物流；各階段列出參與角色。</desc>
<defs><marker id="teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f79"/></marker><marker id="slate" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47647b"/></marker><marker id="hold" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9b4b25"/></marker></defs>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;fill:#203647}.heading{font-size:33px;font-weight:700}.label{font-size:27px;font-weight:700}.body{font-size:22px}.note{font-size:20px}.box{fill:#edf7f4;stroke:#087f79;stroke-width:2}.info{fill:#f0f4f8;stroke:#47647b;stroke-width:2}.white{fill:white;stroke:#3e877e;stroke-width:2}.holdbox{fill:#fff3e9;stroke:#9b4b25;stroke-width:2}.arrow{fill:none;stroke:#087f79;stroke-width:3;marker-end:url(#teal)}.dash{fill:none;stroke:#47647b;stroke-width:3;stroke-dasharray:7 5;marker-end:url(#slate)}.holdarrow{fill:none;stroke:#9b4b25;stroke-width:3;marker-end:url(#hold)}</style>
<rect width="1200" height="1050" rx="24" fill="#fcfdfb"/>
<text x="60" y="56" class="heading" >從需求到出貨：晶片生命旅程</text>
<path d="M65 88H140" class="dash"/>
<text x="155" y="96" class="body" >主要資訊交付</text>
<path d="M400 88H475" class="arrow"/>
<text x="490" y="96" class="body" >晶圓／晶粒實物流</text>
<text x="830" y="96" class="body" >常見參與角色</text>
<rect x="60" y="120" width="700" height="76" rx="12" class="info"/>
<text x="85" y="151" class="label" >01　需求</text>
<text x="85" y="180" class="body" >功能、功耗、成本、可靠度與使用情境</text>
<text x="820" y="165" class="body" >產品、系統與應用團隊</text>
<path d="M410 198V221" class="dash"/>
<rect x="60" y="226" width="700" height="76" rx="12" class="info"/>
<text x="85" y="257" class="label" >02　設計與驗證</text>
<text x="85" y="286" class="body" >架構、電路、版圖與製造規則檢查</text>
<text x="820" y="271" class="body" >IC 設計與驗證團隊</text>
<path d="M410 304V327" class="dash"/>
<rect x="60" y="332" width="700" height="76" rx="12" class="info"/>
<text x="85" y="363" class="label" >03　光罩</text>
<text x="85" y="392" class="body" >版圖資料交付、光罩資料準備與製作</text>
<text x="820" y="377" class="body" >設計、光罩與製造團隊</text>
<path d="M410 410V433" class="dash"/>
<rect x="60" y="438" width="700" height="76" rx="12" class="box"/>
<text x="85" y="469" class="label" >04　投片</text>
<text x="85" y="498" class="body" >依製程、光罩與排程，啟動晶圓批次</text>
<text x="820" y="483" class="body" >生產規劃與晶圓廠</text>
<path d="M410 516V539" class="arrow"/>
<rect x="60" y="544" width="700" height="76" rx="12" class="box"/>
<text x="85" y="575" class="label" >05　晶圓製造</text>
<text x="85" y="604" class="body" >以多個製程模組形成元件與金屬互連</text>
<text x="820" y="589" class="body" >晶圓代工廠或 IDM</text>
<path d="M410 622V645" class="arrow"/>
<rect x="60" y="650" width="700" height="76" rx="12" class="box"/>
<text x="85" y="681" class="label" >06　晶圓測試</text>
<text x="85" y="710" class="body" >量測晶粒電性、分類並記錄晶圓測試圖</text>
<text x="820" y="695" class="body" >測試工程與生產團隊</text>
<path d="M410 728V751" class="arrow"/>
<rect x="60" y="756" width="700" height="76" rx="12" class="box"/>
<text x="85" y="787" class="label" >07　封裝</text>
<text x="85" y="816" class="body" >典型流程含切割、組裝、電連接與保護</text>
<text x="820" y="801" class="body" >封測廠或 IDM</text>
<path d="M410 834V857" class="arrow"/>
<rect x="60" y="862" width="700" height="76" rx="12" class="box"/>
<text x="85" y="893" class="label" >08　最終測試與出貨</text>
<text x="85" y="922" class="body" >檢驗封裝後性能、分級與品質放行</text>
<text x="820" y="907" class="body" >測試、品質與物流團隊</text>
<text x="60" y="980" class="note" >資訊與量測資料貫穿全程；圖中只突出各階段的主要交付物。</text>
<text x="60" y="1012" class="note" >概念示意，非唯一流程；晶圓級封裝等流程順序可不同，角色也可能由同一公司承擔。</text>
</svg>
