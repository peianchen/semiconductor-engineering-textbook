<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc" data-figure-style="sts-flat-v1">
<title id="title">溫度記錄器的功能訊號鏈</title>
<desc id="desc">感測元件、類比前端、ADC、MCU韌體與選配RF收發器。ADC前為連續電訊號，後為數位資料，RF到天線則為類比射頻訊號；ADC另需參考電壓及取樣時脈。供電、接地、時序、頻寬與熱是共同約束。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#2e3d59" stroke-width="1.3"/>
</marker>
<marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#4c6d96" stroke-width="1.3"/>
</marker>
<marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#b56b28" stroke-width="1.3"/>
</marker>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC","DejaVu Sans",sans-serif;fill:#2e3d59}.panel{font-size:25px;font-weight:600}.badge{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#ffffff}.label{font-size:22px}.note{font-size:18px;fill:#536781}.small{font-size:16px;fill:#536781}.symbol{font-size:24px;font-style:italic}.strong{font-size:22px;font-weight:600}.step{font-size:17px;letter-spacing:1.2px;fill:#536781}</style>
</defs>
<rect width="1200" height="410" fill="white"/>
<circle cx="55" cy="35" r="19" fill="#7185a6"/>
<text x="55" y="42" text-anchor="middle" class="badge">1</text>
<text x="88" y="43" class="panel" text-anchor="start">感測記錄器：功能訊號鏈</text>
<line x1="38" y1="64" x2="1162" y2="64" stroke="#c5cfdd" stroke-width="1" />
<rect rx="2" x="46" y="147" width="156" height="97" fill="#91b3d4" stroke="#607b9e" stroke-width="2"/>
<text x="124" y="184" class="label" text-anchor="middle">感測元件</text>
<text x="124" y="212" class="note" text-anchor="middle">溫度 → 電訊號</text>
<rect rx="2" x="241" y="147" width="206" height="97" fill="#91b3d4" stroke="#607b9e" stroke-width="2"/>
<text x="344" y="184" class="label" text-anchor="middle">類比前端</text>
<text x="344" y="212" class="note" text-anchor="middle">偏壓／保護／濾波</text>
<rect rx="2" x="486" y="147" width="136" height="97" fill="#c4d5e7" stroke="#4c6d96" stroke-width="2"/>
<text x="554" y="184" class="label" text-anchor="middle">ADC</text>
<text x="554" y="212" class="note" text-anchor="middle">取樣與量化</text>
<rect rx="2" x="661" y="147" width="174" height="97" fill="#e4eaf2" stroke="#2e3d59" stroke-width="2"/>
<text x="748" y="184" class="label" text-anchor="middle">MCU</text>
<text x="748" y="212" class="note" text-anchor="middle">韌體與運算</text>
<rect rx="2" x="874" y="147" width="166" height="97" fill="#edaa60" stroke="#b56b28" stroke-width="2"/>
<text x="957" y="184" class="label" text-anchor="middle">RF 收發器</text>
<text x="957" y="212" class="note" text-anchor="middle">無線鏈路（選配）</text>
<line x1="204" y1="196" x2="236" y2="196" stroke="#2e3d59" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="449" y1="196" x2="481" y2="196" stroke="#2e3d59" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="624" y1="196" x2="656" y2="196" stroke="#2e3d59" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="837" y1="196" x2="869" y2="196" stroke="#2e3d59" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1042" y1="196" x2="1100" y2="196" stroke="#2e3d59" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M1114 225 V166 M1094 164 L1114 183 L1134 164" fill="none" stroke="#b56b28" stroke-width="2" stroke-linejoin="round" />
<path d="M1141 170 Q1159 194 1141 218 M1151 159 Q1177 194 1151 229" fill="none" stroke="#b56b28" stroke-width="1.5" stroke-linejoin="round" />
<text x="232" y="129" class="note" text-anchor="middle">連續電訊號</text>
<text x="742" y="129" class="note" text-anchor="middle">數位碼／資料</text>
<text x="1096" y="129" class="note" text-anchor="middle">類比 RF</text>
<text x="558" y="297" class="note" text-anchor="middle">參考電壓／取樣時脈</text>
<line x1="554" y1="276" x2="554" y2="247" stroke="#4c6d96" stroke-width="1.8" marker-end="url(#arrowTeal)"/>
<path d="M47 323 V337 H1153 V323" fill="none" stroke="#c5cfdd" stroke-width="1.8" stroke-linejoin="round" />
<text x="600" y="371" class="note" text-anchor="middle">共同約束：供電、接地、時序、頻寬與熱；功能框可整合於同一晶片。</text>

</svg>
