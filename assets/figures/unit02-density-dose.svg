<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc" data-figure-style="sts-flat-v1">
<title id="title">體積濃度、面劑量與總粒子數</title><desc id="desc">自設均勻濃度2乘10的17次方每立方公分、厚度0.2微米的薄層；對深度積分得4乘10的12次方每平方公分。面內均勻且面積1平方毫米時，總數為4乘10的10次方。圖形只示概念，深度軸以微米顯示，計算積分須換成公分。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2e3d59" stroke-width="1.3"/></marker></defs>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC","DejaVu Sans",sans-serif;fill:#2e3d59}.panel{font-size:25px;font-weight:600}.label{font-size:22px}.note{font-size:20px;fill:#536781}.badge{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#ffffff}</style>
<rect width="1200" height="590" fill="#ffffff"/><circle cx="55" cy="35" r="19" fill="#7185a6"/><text x="55" y="42" class="badge" text-anchor="middle">1</text><text x="88" y="43" class="panel" text-anchor="start">體積濃度、面劑量與總粒子數</text><line x1="38" y1="66" x2="1162" y2="66" stroke="#c5cfdd" stroke-width="2"/>
<text x="90" y="120" class="panel" text-anchor="start">面內均勻的薄層</text><rect x="115" y="190" width="250" height="180" fill="#91b3d4" stroke="#607b9e" stroke-width="2"/><path d="M115 190 L160 155 H410 L365 190 Z" fill="#c4d5e7" stroke="#607b9e" stroke-width="2" /><path d="M365 190 L410 155 V335 L365 370 Z" fill="#6c90b9" stroke="#607b9e" stroke-width="2" /><text x="255" y="181" class="note" text-anchor="middle">面積 A</text><text x="240" y="272" class="label" text-anchor="middle">濃度 n₀</text><text x="240" y="309" class="note" text-anchor="middle">固定於厚度內</text><line x1="440" y1="190" x2="440" y2="370" stroke="#2e3d59" stroke-width="2"/><line x1="430" y1="190" x2="450" y2="190" stroke="#2e3d59" stroke-width="2"/><line x1="430" y1="370" x2="450" y2="370" stroke="#2e3d59" stroke-width="2"/><text x="463" y="285" class="label" text-anchor="start">d</text><text x="90" y="424" class="note" text-anchor="start">d = 0.2 µm = 2 × 10⁻⁵ cm</text><line x1="660" y1="380" x2="660" y2="180" stroke="#c5cfdd" stroke-width="2"/><text x="660" y="412" class="note" text-anchor="middle">0</text><line x1="810" y1="380" x2="810" y2="180" stroke="#c5cfdd" stroke-width="2"/><text x="810" y="412" class="note" text-anchor="middle">0.1</text><line x1="960" y1="380" x2="960" y2="180" stroke="#c5cfdd" stroke-width="2"/><text x="960" y="412" class="note" text-anchor="middle">0.2</text><line x1="1110" y1="380" x2="1110" y2="180" stroke="#c5cfdd" stroke-width="2"/><text x="1110" y="412" class="note" text-anchor="middle">0.3</text><line x1="660" y1="380" x2="1110" y2="380" stroke="#c5cfdd" stroke-width="2"/><text x="646" y="387" class="note" text-anchor="end">0</text><line x1="660" y1="313.33333333333337" x2="1110" y2="313.33333333333337" stroke="#c5cfdd" stroke-width="2"/><text x="646" y="320.33333333333337" class="note" text-anchor="end">1</text><line x1="660" y1="246.66666666666669" x2="1110" y2="246.66666666666669" stroke="#c5cfdd" stroke-width="2"/><text x="646" y="253.66666666666669" class="note" text-anchor="end">2</text><line x1="660" y1="180" x2="1110" y2="180" stroke="#c5cfdd" stroke-width="2"/><text x="646" y="187" class="note" text-anchor="end">3</text><line x1="660" y1="380" x2="1120" y2="380" stroke="#2e3d59" stroke-width="2"/><line x1="660" y1="380" x2="660" y2="170" stroke="#2e3d59" stroke-width="2"/><text x="885" y="452" class="label" text-anchor="middle">深度 z (µm)</text><text x="660" y="150" class="label" text-anchor="start">n(z) (10¹⁷ cm⁻³)</text><path d="M660 380 L660 246.66666666666669 L960 246.66666666666669 L960 380 Z" fill="#faead7" stroke="#b56b28" stroke-width="2" /><path d="M660 246.66666666666669 H960 V380 H1110" fill="none" stroke="#4c6d96" stroke-width="3" /><text x="805" y="294" class="note" text-anchor="middle">面積代表面劑量 D</text><text x="600" y="504" class="label" text-anchor="middle">D = ∫ n(z) dz = 4 × 10¹² cm⁻²</text><text x="600" y="545" class="label" text-anchor="middle">若 A = 1 mm² = 0.01 cm²，則總數 N = AD = 4 × 10¹⁰</text>
</svg>
