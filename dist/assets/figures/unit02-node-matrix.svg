<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc" data-figure-style="sts-flat-v1">
<title id="title">兩個節點，兩條獨立的電流守恆式</title><desc id="desc">兩節點間1千歐，每個節點對地各1千歐，各有1毫安電流由外部注入。每列方程表示一個節點的電流守恆；電壓以1伏正規化後得到矩陣2,-1;-1,2乘x,y等於1,1。解為兩節點各1伏。注入箭頭代表外部電流端口，不是完整電源接線圖。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2e3d59" stroke-width="1.3"/></marker></defs>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans CJK SC","DejaVu Sans",sans-serif;fill:#2e3d59}.panel{font-size:25px;font-weight:600}.label{font-size:22px}.note{font-size:20px;fill:#536781}.badge{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#ffffff}</style>
<rect width="1200" height="600" fill="#ffffff"/><circle cx="55" cy="35" r="19" fill="#7185a6"/><text x="55" y="42" class="badge" text-anchor="middle">1</text><text x="88" y="43" class="panel" text-anchor="start">兩個節點，兩條獨立的電流守恆式</text><line x1="38" y1="66" x2="1162" y2="66" stroke="#c5cfdd" stroke-width="2"/>
<text x="75" y="116" class="note" text-anchor="start">每顆電阻 1 kΩ；每端注入 1 mA</text><path d="M190 180 H300 M380 180 H490 M190 180 V260 M490 180 V260" fill="none" stroke="#2e3d59" stroke-width="2" /><rect x="300" y="167" width="80" height="26" fill="#ffffff" stroke="#2e3d59" stroke-width="2"/><rect x="177" y="260" width="26" height="80" fill="#ffffff" stroke="#2e3d59" stroke-width="2"/><rect x="477" y="260" width="26" height="80" fill="#ffffff" stroke="#2e3d59" stroke-width="2"/><path d="M190 340 V405 H490 V340" fill="none" stroke="#2e3d59" stroke-width="2" /><line x1="340" y1="405" x2="340" y2="427" stroke="#2e3d59" stroke-width="2"/><line x1="318" y1="427" x2="362" y2="427" stroke="#2e3d59" stroke-width="2"/><line x1="325" y1="436" x2="355" y2="436" stroke="#2e3d59" stroke-width="2"/><line x1="332" y1="445" x2="348" y2="445" stroke="#2e3d59" stroke-width="2"/><circle cx="190" cy="180" r="6" fill="#4c6d96"/><circle cx="490" cy="180" r="6" fill="#4c6d96"/><text x="190" y="154" class="label" text-anchor="middle">V₁</text><text x="490" y="154" class="label" text-anchor="middle">V₂</text><path d="M95 180 H180" fill="none" stroke="#2e3d59" stroke-width="2" marker-end="url(#arrow)"/><path d="M585 180 H500" fill="none" stroke="#2e3d59" stroke-width="2" marker-end="url(#arrow)"/><text x="90" y="217" class="label" text-anchor="start">I₁</text><text x="567" y="217" class="label" text-anchor="start">I₂</text><text x="80" y="492" class="note" text-anchor="start">注入節點的電流 = 流向地端 + 流向另一節點</text><text x="680" y="145" class="label" text-anchor="start">以電壓 1 V 為基準正規化</text><text x="680" y="187" class="note" text-anchor="start">x = V₁/(1 V)，y = V₂/(1 V)</text><text x="735" y="249" class="panel" text-anchor="start">2x − y = 1</text><text x="735" y="298" class="panel" text-anchor="start">−x + 2y = 1</text><text x="680" y="360" class="note" text-anchor="start">係數矩陣 × 未知向量 = 激勵向量</text><path d="M712 383 H699 V465 H712 M801 383 H814 V465 H801 M847 383 H834 V465 H847 M890 383 H903 V465 H890 M979 383 H966 V465 H979 M1023 383 H1036 V465 H1023" fill="none" stroke="#2e3d59" stroke-width="2" /><text x="730" y="414" class="label" text-anchor="start">2</text><text x="775" y="414" class="label" text-anchor="start">−1</text><text x="724" y="452" class="label" text-anchor="start">−1</text><text x="781" y="452" class="label" text-anchor="start">2</text><text x="861" y="414" class="label" text-anchor="start">x</text><text x="861" y="452" class="label" text-anchor="start">y</text><text x="929" y="434" class="label" text-anchor="start">=</text><text x="990" y="414" class="label" text-anchor="start">1</text><text x="990" y="452" class="label" text-anchor="start">1</text><text x="600" y="556" class="label" text-anchor="middle">解得 x = y = 1，因此 V₁ = V₂ = 1 V；兩節點間的電阻電流為零。</text>
</svg>
