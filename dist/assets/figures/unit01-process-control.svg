<text x="641" y="524" class="note" text-anchor="middle">是</text>
<rect rx="2" x="719" y="506" width="155" height="72" fill="#c4d5e7" stroke="#4c6d96" stroke-width="2"/>
<text x="796" y="551" class="label" text-anchor="middle">核准放行</text>
<line x1="877" y1="542" x2="972" y2="542" stroke="#4c6d96" stroke-width="1.8" marker-end="url(#arrowTeal)"/>
<text x="1065" y="551" class="label" text-anchor="middle">下一製程站</text>
<line x1="474" y1="609" x2="474" y2="669" stroke="#b56b28" stroke-width="1.8" marker-end="url(#arrowOrange)"/>
<text x="495" y="648" class="note" text-anchor="start">否</text>
<rect rx="2" x="359" y="675" width="230" height="68" fill="#faead7" stroke="#b56b28" stroke-width="2"/>
<text x="474" y="717" class="label" text-anchor="middle">暫停／隔離</text>
<line x1="593" y1="709" x2="700" y2="709" stroke="#b56b28" stroke-width="1.8" marker-end="url(#arrowOrange)"/>
<rect rx="2" x="706" y="667" width="444" height="84" fill="white" stroke="#b56b28" stroke-width="2"/>
<text x="928" y="701" class="label" text-anchor="middle">確認量測與履歷 → 工程判定</text>
<text x="928" y="729" class="note" text-anchor="middle">返工僅限已驗證且核准的條件</text>
<line x1="38" y1="782" x2="1162" y2="782" stroke="#c5cfdd" stroke-width="1" />
<text x="38" y="815" class="note" text-anchor="start">追溯：Lot／晶圓 ID  •  Route 版本  •  Recipe 版本  •  設備與量測履歷</text>
<text x="38" y="850" class="note" text-anchor="start">示意而非設備配方；抽樣與量測站依控制計畫安排，並非每步都有同一套檢查。</text>
</svg>
