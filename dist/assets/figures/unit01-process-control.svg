<rect rx="2" x="800" y="317" width="24" height="18" fill="#edaa60" stroke="#b56b28" stroke-width="2"/>
<text x="837" y="333" class="note" text-anchor="start">光阻遮罩</text>
<text x="600" y="370" class="note" text-anchor="middle">理想選擇性與近垂直側壁；遮罩下薄膜保留，下方基板未被蝕刻。</text>
<line x1="38" y1="398" x2="1162" y2="398" stroke="#c5cfdd" stroke-width="1" />
<circle cx="55" cy="432" r="19" fill="#7185a6"/>
<text x="55" y="439" text-anchor="middle" class="badge">2</text>
<text x="88" y="440" class="panel" text-anchor="start">控制計畫：量測、判定與處置</text>
<rect rx="2" x="58" y="496" width="222" height="92" fill="white" stroke="#2e3d59" stroke-width="2"/>
<text x="169" y="530" class="label" text-anchor="middle">量測與資料確認</text>
<text x="169" y="558" class="note" text-anchor="middle">膜厚／線寬／電性等</text>
