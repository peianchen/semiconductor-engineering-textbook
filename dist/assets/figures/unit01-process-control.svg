<text x="55" y="42" text-anchor="middle" class="badge">1</text>
<text x="88" y="43" class="panel" text-anchor="start">一個具體例子：薄膜的圖案化蝕刻</text>
<line x1="38" y1="64" x2="1162" y2="64" stroke="#c5cfdd" stroke-width="1" />
<text x="165" y="108" class="label" text-anchor="middle">1  薄膜形成</text>
<text x="455" y="108" class="label" text-anchor="middle">2  微影後遮罩</text>
<text x="745" y="108" class="label" text-anchor="middle">3  開口處蝕刻</text>
<text x="1035" y="108" class="label" text-anchor="middle">4  去除光阻</text>
